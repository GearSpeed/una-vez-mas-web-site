<header
  class="fixed top-0 left-0 right-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(67,37,28,0.06)]"
>
  <div
    class="h-20 max-w-7xl mx-auto px-margin lg:px-margin-desktop flex items-center justify-between gap-4"
  >
    <!-- Logotipo -->
    <a class="flex items-center gap-3 group shrink-0" routerLink="/inicio">
      <img
        alt="Emblema de Una vez más: cráneo prehispánico con penacho de espigas de amaranto"
        class="h-11 w-auto object-contain transition-transform group-hover:scale-105"
        height="497"
        src="img/marca/logo.png"
        width="512"
      />
      <span class="flex flex-col">
        <span class="font-headline-sm text-headline-sm text-primary tracking-tight leading-none">
          {{ sitio.nombre }}
        </span>
        <span class="font-label-sm text-label-sm text-on-surface-variant tracking-wide">
          {{ sitio.lema }}
        </span>
      </span>
    </a>

    <!-- Navegación de escritorio -->
    <nav
      aria-label="Navegación principal"
      class="hidden lg:flex items-center gap-1 bg-surface-container-lowest/80 p-1.5 rounded-full shadow-[0_2px_4px_rgba(67,37,28,0.04)]"
    >
      @for (item of nav; track item.ruta) {
        <a
          [attr.aria-current]="activo.isActive ? 'page' : null"
          [class]="activo.isActive ? navActivo : navInactivo"
          [routerLink]="item.ruta"
          routerLinkActive
          #activo="routerLinkActive"
          >{{ item.texto }}</a
        >
      }
    </nav>

    <!-- Acciones -->
    <div class="flex items-center gap-3">
      <a
        class="hidden sm:flex items-center gap-2 px-3 py-2 rounded-full bg-surface-container-high hover:bg-tertiary-fixed text-on-surface hover:text-on-tertiary-fixed transition-colors"
        rel="noopener noreferrer"
        target="_blank"
        title="WhatsApp directo"
        [href]="waPedido"
      >
        <span aria-hidden="true" class="material-symbols-outlined text-primary text-[20px]"
          >chat</span
        >
        <span class="hidden xl:inline font-label-sm text-label-sm">WhatsApp</span>
        <span class="sr-only">Escríbenos por WhatsApp</span>
      </a>

      <a
        class="hidden md:inline-flex items-center justify-center h-[46px] px-5 rounded-full bg-primary-container text-on-primary font-label-md text-label-md hover:bg-secondary-container transition-all transform hover:scale-[1.02] shadow-[0_4px_10px_rgba(128,15,53,0.15)]"
        routerLink="/catalogo"
        >Ver catálogo</a
      >

      <button
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-movil"
        aria-label="Abrir menú de navegación"
        class="lg:hidden w-10 h-10 rounded-full flex items-center justify-center bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors"
        type="button"
        (click)="alternarMenu()"
      >
        <span aria-hidden="true" class="material-symbols-outlined text-[22px]">
          {{ menuAbierto() ? 'close' : 'menu' }}
        </span>
      </button>
    </div>
  </div>

  <!-- Drawer móvil. El maquetado tenía el botón pero no el panel. -->
  <div
    [hidden]="!menuAbierto()"
    class="lg:hidden border-t border-outline-variant/40 bg-surface/95 backdrop-blur-xl shadow-[0_8px_24px_rgba(67,37,28,0.10)]"
    id="menu-movil"
  >
    <nav
      aria-label="Navegación principal"
      class="max-w-7xl mx-auto px-margin py-space-md flex flex-col gap-1"
    >
      @for (item of nav; track item.ruta) {
        <a
          [attr.aria-current]="activoMovil.isActive ? 'page' : null"
          [class]="
            activoMovil.isActive
              ? 'flex items-center justify-between px-4 py-3 rounded-full font-label-md text-label-md bg-primary-container text-on-primary'
              : 'flex items-center justify-between px-4 py-3 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors'
          "
          [routerLink]="item.ruta"
          routerLinkActive
          #activoMovil="routerLinkActive"
        >
          <span>{{ item.texto }}</span>
          <span aria-hidden="true" class="material-symbols-outlined text-[18px]"
            >chevron_right</span
          >
        </a>
      }

      <a
        class="mt-space-sm h-[52px] px-6 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm"
        routerLink="/catalogo"
      >
        <span aria-hidden="true" class="material-symbols-outlined text-[20px]">menu_book</span>
        <span>Ver catálogo</span>
      </a>

      <a
        class="h-[52px] px-6 rounded-full bg-surface-container-lowest text-primary font-label-lg text-label-lg flex items-center justify-center gap-2.5 shadow-sm"
        rel="noopener noreferrer"
        target="_blank"
        [href]="waPedido"
      >
        <span aria-hidden="true" class="material-symbols-outlined text-secondary text-[22px]"
          >chat</span
        >
        <span>Pedir por WhatsApp</span>
      </a>
    </nav>
  </div>
</header>

<!-- Telón: cerrar tocando fuera del drawer -->
@if (menuAbierto()) {
  <button
    aria-label="Cerrar menú"
    class="lg:hidden fixed inset-0 top-20 z-40 bg-on-surface/30 backdrop-blur-sm"
    tabindex="-1"
    type="button"
    (click)="cerrarMenu()"
  ></button>
}
